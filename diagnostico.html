MANAGEMENT:{t:'Gestão, Metas & Previsibilidade',c:'#16a34a',i:'👥',d:'Gestão de pipeline, métricas de esforço e forecast para 2027',s:'Gestão/Forecast'}};

{id:1,p:'DEMAND',q:'Como a sua indústria gera a maior parte dos novos leads (oportunidades) B2B hoje?',o:[

{id:4,p:'PROCESS',q:'Como funciona a rotina de acompanhamento (follow-up) de propostas enviadas que não fecham de imediato?',o:[

['O vendedor faz 2 ou 3 tentativas por WhatsApp e depois abandona o lead',50,'Desistência precoce de negociações complexas B2B.'],
['Há uma rotina básica de cobrança, mas sem cadência multicanal ou automações',75,'Falta de ferramentas para automatizar cobranças de follow-up.'],

['O CRM é o centro da operação, totalmente integrado a e-mail, WhatsApp e IA',100,null]]},
{id:6,p:'TECH',q:'Quanto tempo estimado os seus vendedores perdem por dia com tarefas manuais e burocracia interna?',o:[

['Entre 1 e 2 horas/dia com burocracias repetitivas',55,'Vendedores com tempo reduzido para atendimento direto a clientes.'],
['Cerca de 30 a 60 minutos por dia',80,'Pequenas ineficiências em modelos de propostas e registros manuais.'],

{id:7,p:'MANAGEMENT',q:'A diretoria consegue prever com exatidão o faturamento dos próximos 90 dias com base no pipeline do CRM?',o:[

['Temos uma noção aproximada pelo feeling do gerente comercial',45,'Gestão comercial pautada em intuição em vez de governança de dados.'],
['A previsão acerta cerca de 60% a 70% das vezes',75,'Imprecisão no forecast por falta de qualificação de etapas.'],
['Previsão de vendas (forecast) altamente assertiva (+85% de precisão)',100,null]]},
{id:8,p:'MANAGEMENT',q:'Qual é o grau de preparação da sua operação comercial para lidar com mudanças trabalhistas (ex: fim da escala 6x1) e novos cenários em 2027?',o:[

['Preocupados, mas ainda sem plano concreto de aumento de produtividade',50,'Incerteza estratégica sobre como otimizar a equipe sem inflar a folha.'],
['Estamos revisando processos para ganhar eficiência interna nos próximos meses',80,'Planejamento 2027 em andamento, necessitando de método de validação.'],
['Totalmente preparados: estrutura ágil, automatizada e orientada a dados',100,null]]}];
let S={qi:0,ans:{},info:{}};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=n=>Number(n).toLocaleString('pt-BR');
const inp='w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-blue-500';
const lbl='block text-xs font-semibold uppercase text-slate-400 mb-1';
const fld=(n,l,ph,t='text',x='')=>`<div><label class="${lbl}">${l}</label><input name="${n}" type="${t}" required placeholder="${ph}" ${x} class="${inp} ${t=='number'?'text-center font-bold':''}"></div>`;

function intro(){
