    status_maturidade: tier[0]
};

const WEBHOOK_URL = "SUA_URL_DO_WEBHOOK_AQUI"; 

if(WEBHOOK_URL !== "SUA_URL_DO_WEBHOOK_AQUI"){
    fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dadosParaEnviar)
    }).catch(err => console.error("Erro na integração:", err));
}

window.scrollTo(0,0);
}
intro();
